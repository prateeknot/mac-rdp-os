name: macOS Tahoe Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-remote:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check macOS
        run: |
          sw_vers
          echo "User: $(whoami)"
          echo "Home: $HOME"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Download RDP server
        run: |
          set -e

          mkdir -p "$HOME/macos-rdp/bin"
          mkdir -p "$HOME/macos-rdp/logs"

          curl -fL \
            https://github.com/grioghar/macos-rdp-server/releases/latest/download/macos-rdp-daemon \
            -o "$HOME/macos-rdp/bin/macos-rdp-daemon"

          chmod +x "$HOME/macos-rdp/bin/macos-rdp-daemon"

          echo "RDP server downloaded."
          file "$HOME/macos-rdp/bin/macos-rdp-daemon"

      - name: Generate certificate
        run: |
          set -e

          RDP_HOME="$HOME/macos-rdp"

          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -days 365 \
            -keyout "$RDP_HOME/server.key" \
            -out "$RDP_HOME/server.crt" \
            -subj "/CN=macos-tahoe" \
            >/dev/null 2>&1

          chmod 600 "$RDP_HOME/server.key"

          echo "Certificate created."

      - name: Start RDP server
        run: |
          set -e

          RDP_HOME="$HOME/macos-rdp"
          BIN="$RDP_HOME/bin/macos-rdp-daemon"
          LOG="$RDP_HOME/logs/rdp.log"

          echo "Starting RDP server..."

          nohup "$BIN" \
            --port 3389 \
            --log-level verbose \
            >> "$LOG" 2>&1 &

          echo $! > "$RDP_HOME/rdp.pid"

          sleep 5

          echo
          echo "===== PROCESS ====="
          ps aux | grep '[m]acos-rdp-daemon' || true

          echo
          echo "===== PORT 3389 ====="
          lsof -nP -iTCP:3389 -sTCP:LISTEN || true

          echo
          echo "===== LOG ====="
          cat "$LOG" || true

      - name: Show connection information
        run: |
          echo
          echo "========================================"
          echo "TAILSCALE"
          echo "========================================"

          tailscale status || true

          IP="$(tailscale ip -4 | head -n 1)"

          echo
          echo "Tailscale IP:"
          echo "$IP"

          echo
          echo "Windows Remote Desktop:"
          echo "$IP:3389"

          echo
          echo "Use:"
          echo "Win + R -> mstsc"
          echo "Then enter: $IP:3389"

      - name: Keep session alive
        run: |
          echo "Remote macOS session is active."

          SECONDS=0

          while [ "$SECONDS" -lt 14400 ]; do
            echo
            echo "===== $(date) ====="

            ps aux | grep '[m]acos-rdp-daemon' || true
            lsof -nP -iTCP:3389 -sTCP:LISTEN || true

            sleep 30
          done

          echo "4-hour session finished."
